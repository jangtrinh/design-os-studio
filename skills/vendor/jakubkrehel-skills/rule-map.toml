map = "skill:generate-library/tokens"
canvas_text = "Keep derived colours such as a `color-mix()` tint out of the token layer: store the resulting tint as an explicit colour variable value, because a mixed colour cannot be inspected in a design tool."

[[rule]]
id = "better-colors/color-formats#6"
text_sha1 = "93713ab35f290341e7157a7e2cf541bf3683736c"
map = "skill:generate-library/tokens"
canvas_text = "Do not define a colour variable by chained derivations such as relative colour syntax that darkens an accent by hand: one derivation at most, otherwise the token is unreadable."

[[rule]]
id = "better-colors/color-formats#7"
text_sha1 = "0d15faf3123e77fab33b2cd4981cc2c61304c32f"
map = "skill:generate-library/tokens"
canvas_text = "Keep both appearances of a colour in one variable as its Light and Dark modes, the canvas equivalent of `light-dark()`, instead of two unrelated variables."

[[rule]]
id = "better-colors/contrast#1"
text_sha1 = "917e58958121338742b13c3f242c755c90f804b8"
map = "lint:contrast"
canvas_text = "A mid-lightness background (OKLCH L near 0.75) caps achievable contrast even for black text (about Lc 60); move body-text backgrounds toward one lightness extreme; check with `designos_lint` contrast."

[[rule]]
id = "better-colors/contrast#2"
text_sha1 = "a38d434a4c556d4a3d8eb6f1cb50cc315b16abbd"
map = "rubric:color"
canvas_text = "When pushing lightness to fix contrast, reduce saturation as needed so the colour stays inside the document gamut (Display P3) and remains renderable."

[[rule]]
id = "better-colors/contrast#3"
text_sha1 = "1fb67200120257e89f878bb8e9209cdc096366b7"
map = "lint:contrast"
canvas_text = "Check every foreground and background pair in every appearance: a pair that passes in the Light mode can fail in the Dark mode; run `designos_lint` contrast on both."

[[rule]]
id = "better-colors/contrast#4"
text_sha1 = "f8ef81d7f4b82a27eefc2e565a7fc69a0171e3d0"
map = "lint:contrast"
canvas_text = "For text on a translucent or background-blur surface, test against the lightest and darkest content that can sit behind it, or make the surface opaque enough that the shift cannot break the pair."

[[rule]]
id = "better-colors/contrast#5"
text_sha1 = "b07e23e61f2d224766ef526d2dcf636d14ced682"
map = "lint:contrast"
canvas_text = "Measure the rendered result of computed colours (mixes, relative colours, opacity modifiers), not the declaration; `designos_lint` contrast uses the resolved colour."

[[rule]]
id = "better-colors/contrast#6"
text_sha1 = "fc3d84dc7eadaa4fb654e3264bf3d9db326f3b66"
map = "lint:contrast"
canvas_text = "For text over an image there is no single background colour: measure the worst region, or guarantee one with a scrim behind the text."

[[rule]]
id = "better-colors/palette-generation#1"
text_sha1 = "36e06847c61eea9ba76f6c5302e01faea801afb4"
map = "rubric:color"
canvas_text = "Step a ramp's lightness steadily in OKLCH L; evenly spaced HSL lightness is not perceptual and bunches at one end."

[[rule]]
id = "better-colors/palette-generation#2"
text_sha1 = "91c106efa8fab6255fe38bf15b83bfe073de095f"
map = "rubric:color"
canvas_text = "Hold hue constant from one end of a ramp to the other so every step reads as the same colour, and so it sits against a neutral built on a different hue."

[[rule]]
id = "better-colors/palette-generation#3"
text_sha1 = "387d2e77132a371f71c74bdf5de45902b5f911b9"
map = "rubric:color"
canvas_text = "Let vividness peak in the middle of a ramp and fall off at both ends: the lightest and darkest steps are nearly neutral, so the 50 does not glow and the 950 does not look like spilled ink."

[[rule]]
id = "better-colors/palette-generation#4"
text_sha1 = "9b7ae45e40ab621ed1dffff214ab04bb51ed9d7a"
map = "rubric:color"
canvas_text = "Space ramp steps finer at the light end: about 0.04 to 0.05 OKLCH L apart for steps 50 to 200 and 0.07 to 0.10 mid-ramp, so there are enough pale steps for a subtle surface."

[[rule]]
id = "better-colors/palette-generation#5"
text_sha1 = "e6ae31229e9c6ffcfbc32cef4d0c400e23159fdb"
map = "rubric:color"
canvas_text = "Keep adjacent ramp steps at least 0.03 OKLCH L apart; closer steps mean the ramp has more steps than decisions, so drop one."

[[rule]]
id = "better-colors/palette-generation#6"
text_sha1 = "7f08332dc45125e2af11c3d780915837ddb439ee"
map = "rubric:color"
canvas_text = "Stop both ends of a ramp short of pure black and pure white, so the ramp keeps its identity where the page background lives."

[[rule]]
id = "better-colors/palette-generation#7"
text_sha1 = "d0b98bfd6a314ae63a52e82c3c92c8c6875881d3"
map = "rubric:color"
canvas_text = "Match perceived lightness exactly across hues: the same step has the same brightness in every ramp."

[[rule]]
id = "better-colors/palette-generation#8"
text_sha1 = "1d304d08fcc01959f0bfb0151e956f8e81845c68"
map = "rubric:color"
canvas_text = "Match vividness across hues in proportion to what each hue can reach, not by one absolute chroma; a saturated yellow and a saturated blue are not equally far from gray."

[[rule]]
id = "better-colors/palette-generation#9"
text_sha1 = "7e0a927026306b281c1d4595e585a23fa25c11ef"
map = "rubric:color"
canvas_text = "Bring vividness down in dark appearances: an accent that reads confident on white reads neon on near-black, so use it a step or two less vivid."

[[rule]]
id = "better-colors/palette-generation#10"
text_sha1 = "11ae3d561b010ba0b625151357f192eec270d69a"
map = "rubric:color"
canvas_text = "Give the dark end of a ramp more separation between steps: steps that read as distinct pale backgrounds collapse into each other as dark surfaces."

[[rule]]
id = "better-colors/palette-generation#11"
text_sha1 = "ee65cf84530375f5b10db753e9d1343453c750b2"
map = "lint:contrast"
canvas_text = "Contrast does not survive the mirror: recheck every pair in both appearances with `designos_lint` contrast, because mirrored pairs score differently."

[[rule]]
id = "better-colors/palette-generation#12"
text_sha1 = "843e23be8c66307aa096f0ef2fc0a454645ff8f1"
map = "web-only"
reason = "CSS media queries (`prefers-color-scheme`), `.dark` selector toggling, and `light-dark()` syntax are CSS runtime mechanisms."

[[rule]]
