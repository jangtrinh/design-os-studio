text_sha1 = "55c53cd7c0efa543758c74f4cc03b7dbe44fe04b"
map = "rubric:color"
canvas_text = "In every variant no state or meaning rides on colour alone and no state change on motion alone."

[[rule]]
id = "variant/SKILL#7"
text_sha1 = "27eda756cacc14cd45cc82f0e216e7e4c2b3effd"
map = "rubric:consistency"
canvas_text = "In every variant a destructive action has a confirmation, an undo or a distinct treatment."

[[rule]]
id = "variant/SKILL#8"
text_sha1 = "39992a9f37ee753f9d125cee43e23a540dc1989e"
map = "lint:text-truncated"
canvas_text = "Truncated content in a variant has a way to reach the full value; check with `designos_lint` text-truncated."

[[rule]]
id = "variant/SKILL#9"
text_sha1 = "446a47b77222e058633199f44faa0a5080758642"
map = "rubric:layout"
canvas_text = "Nothing in a variant hides past a scroll edge or behind a disclosure with no visible cue."

[[rule]]
id = "variant/SKILL#10"
text_sha1 = "e327d64e4f6a352e6d54c87464991d7ca4cbe4e3"
map = "rubric:consistency"
canvas_text = "Every error shown in a variant names a way to recover."

[[rule]]
id = "variant/SKILL#11"
text_sha1 = "02c9abc3835d29d8d2aaa3a1dafdbab9aca57e01"
map = "rubric:color"
canvas_text = "No semantic colour in a variant is used against its meaning, such as the danger hue on a non-destructive action."

[[rule]]
id = "variant/SKILL#12"
text_sha1 = "f5218aa2ba40c8eda44383b4fa77c0717e9fda92"
map = "rubric:consistency"
canvas_text = "Before exploring variants, read the project's styling system, component library and any motion library, and stay inside them."

[[rule]]
id = "variant/SKILL#13"
text_sha1 = "f278d79e095e42e529e290647a200002ed4a992f"
map = "lint:hardcoded-value"
canvas_text = "Read the tokens (colour, spacing, radius, type scale, easing) and bind each variant to them instead of raw values; check with `designos_lint` hardcoded-value."

[[rule]]
id = "variant/SKILL#14"
text_sha1 = "005d6569e0e32845965ae3bb6df0b755c53a4efb"
map = "rubric:consistency"
canvas_text = "Respect the product's density and voice: a dense professional tool bounds how far the boldest variant may go."

[[rule]]
id = "variant/SKILL#15"
text_sha1 = "57da697f7924d73ae96de0f8a8b99134f03d666b"
map = "rubric:consistency"
canvas_text = "Design each variant for where the piece renders: against what background, beside which neighbours, at which widths."

[[rule]]
id = "variant/picker#1"
text_sha1 = "234c6e655ce430ce3217e263c97faaa5eb57869f"
map = "skill:generate-design/variants"
canvas_text = "Give every group of the variant picker a heading, even when there is only one, and put the same small arrow icon on every heading."

[[rule]]
