text_sha1 = "3f48754940b10f81aa32e9520db9ec53ee4b3c79"
map = "skill:generate-library/tokens"
canvas_text = "Where steps are defined by lightness, as Tailwind does (50 light, 950 dark), the mapping inverts in dark mode: components either swap step numbers per appearance or read one semantic token that swaps once."

[[rule]]
id = "better-colors/palette-structure#3"
text_sha1 = "565de8076704a0e99cbdd59f492f07faeb3bebb7"
map = "skill:generate-library/tokens"
canvas_text = "Keep every status hue at least 15 degrees of OKLCH hue away from the accent; if the brand is red, danger cannot also be red, so give the destructive action a distinct treatment such as an outlined button with an icon."

[[rule]]
id = "better-colors/palette-structure#4"
text_sha1 = "668cc9539633a0cedbe2a3cbf1c92bb9246a17b8"
map = "skill:generate-library/tokens"
canvas_text = "Give status ramps fewer steps than the accent: most render four roles (background, border, solid fill, text); generate the full ramp only where the product styles status components across the whole range."

[[rule]]
id = "better-colors/palette-structure#5"
text_sha1 = "d54b59896bd2c0df3d8da4a037c572a17bd0838a"
map = "lint:hardcoded-color"
canvas_text = "Collect every colour literal in the document, including SVG fills and strokes and chart colours, before tokenising; check with `designos_lint` hardcoded-color."

[[rule]]
id = "better-colors/palette-structure#6"
text_sha1 = "c89a5cb894fc49aed36266d7c61ace495984f929"
map = "skill:generate-library/tokens"
canvas_text = "Sort the collected colours by perceived lightness within each hue family so duplicates surface as near-identical neighbours."

[[rule]]
id = "better-colors/palette-structure#7"
text_sha1 = "aad6239a89b4d5caabd05753b820da89c2485ab7"
map = "lint:hardcoded-color"
canvas_text = "Collapse near-duplicate colours: two colours within 0.02 OKLab delta E are one colour that drifted, so keep the most used and retire the others, never average them."

[[rule]]
id = "better-colors/palette-structure#8"
text_sha1 = "60d1956183c24559e75931d334f97b90bda7e1d7"
map = "lint:hardcoded-color"
canvas_text = "Assign every surviving colour a role from the palette structure; a colour that matches no role is a missing token or a mistake, and the finding says which."

[[rule]]
id = "better-colors/palette-structure#9"
text_sha1 = "14931a4cbdfeb42c4792c70a91352e89bc4b1086"
map = "skill:generate-library/tokens"
canvas_text = "Count the ramps left: more ramps than the system needs means the palette outgrew its structure, not that the product needs more colour."

[[rule]]
id = "better-interface/SKILL#1"
text_sha1 = "4e40c9bd7d46c3c52e4f5df0065cb6e25e994907"
map = "skill:critique/workflow"
canvas_text = "Run the accessibility review domain as one of the six domains of a critique."

[[rule]]
id = "better-interface/SKILL#2"
text_sha1 = "d14cc166de7b71a1fd3c775eb9b51631b4be98fc"
map = "skill:critique/workflow"
canvas_text = "Run the layout review domain as one of the six domains of a critique."

[[rule]]
id = "better-interface/SKILL#3"
text_sha1 = "9694ce0e643cb4e54358b6d5d8da19682ebc900a"
map = "skill:critique/workflow"
canvas_text = "Run the writing review domain (UI copy) as one of the six domains of a critique."

[[rule]]
id = "better-interface/SKILL#4"
text_sha1 = "60dd47c7ad399270e60711ccd96155299d7ceb82"
map = "skill:critique/workflow"
canvas_text = "Run the typography review domain as one of the six domains of a critique."

[[rule]]
id = "better-interface/SKILL#5"
text_sha1 = "b1c27fba0f555573ad55df3f8827a98e9ffa61eb"
map = "skill:critique/workflow"
canvas_text = "Run the colour review domain as one of the six domains of a critique."

[[rule]]
id = "better-interface/SKILL#6"
text_sha1 = "4745f9558e4089dd716bd36f4a2ed52b52e2bf5a"
map = "skill:critique/workflow"
canvas_text = "Run the UI craft review domain (motion, icons, interaction polish) as one of the six domains of a critique."

[[rule]]
id = "better-interface/SKILL#7"
text_sha1 = "5e4ee7bf466d5c552031b57855a2333b533c199e"
map = "skill:critique/workflow"
canvas_text = "Rate a finding HIGH when it blocks a task, misleads the user, hides content or controls, risks data loss, or repeats as a systemic failure."

[[rule]]
id = "better-interface/SKILL#8"
text_sha1 = "559f14c21d3b5b8cad086782d167777c7e438f27"
map = "skill:critique/workflow"
canvas_text = "Rate a finding MEDIUM when it meaningfully harms comprehension, efficiency, adaptability or consistency."

[[rule]]
id = "better-interface/SKILL#9"
text_sha1 = "ff8e4ad1232ccd7a2c3c5385da1b1e155a5e9918"
map = "skill:critique/workflow"
canvas_text = "Rate a finding LOW when it is isolated polish with limited task impact."

[[rule]]
id = "better-interface/SKILL#10"
text_sha1 = "0240206d8e05c0d6d8be817f395d853a0629bdbd"
map = "web-only"
reason = "An interactive control with no accessible name is a DOM accessibility-tree finding."

[[rule]]
id = "better-interface/SKILL#11"
text_sha1 = "a67dca52148e01f0987010b112a38922566ac1e1"
map = "web-only"
reason = "DOM keyboard reachability, `:focus-visible` outlines, and `prefers-reduced-motion` media queries are web runtime checks."

[[rule]]
id = "better-interface/SKILL#12"
text_sha1 = "2293fe07002cf75009d5d3b7db50a8adf3e85b8a"
map = "web-only"
reason = "DOM keyboard reachability, `:focus-visible` outlines, and `prefers-reduced-motion` media queries are web runtime checks."

[[rule]]
id = "better-interface/SKILL#13"
text_sha1 = "eb5a4cfa9654edf994f4e12fe84a734b8806bb71"
map = "web-only"
reason = "DOM keyboard reachability, `:focus-visible` outlines, and `prefers-reduced-motion` media queries are web runtime checks."

[[rule]]
id = "better-interface/SKILL#14"
text_sha1 = "11cdd695d664407f1ccae4e7caa16f2f1d6800b2"
map = "lint:clipped-partial"
canvas_text = "Flag content or a control that is clipped, overlapped or unreachable at 320 px width or 200% zoom; check with `designos_lint` clipped-partial, sibling-overlap and overflow-parent."

[[rule]]
id = "better-interface/SKILL#15"
text_sha1 = "973d57c1675695f2fba692b42a1937f7895840bb"
map = "lint:contrast"
canvas_text = "Flag body or control text whose rendered contrast pair fails its required ratio; check with `designos_lint` contrast."

[[rule]]
id = "better-interface/SKILL#16"
text_sha1 = "b0dcbc10d0a6fe366400220219d5340de5ee9202"
map = "rubric:color"
canvas_text = "Flag any state or meaning carried by colour alone; pair it with an icon, a label or a shape."

[[rule]]
id = "better-interface/SKILL#17"
text_sha1 = "ef7207888f21e61f7cd32242d0fa02fee285af5c"
map = "skill:critique/workflow"
canvas_text = "Flag a destructive action that has no confirmation, no undo and no distinct treatment."

[[rule]]
id = "better-interface/SKILL#18"
text_sha1 = "18b5e5a721431a9a8f975c0fd7cb99fea31abe03"
map = "skill:critique/workflow"
canvas_text = "Flag truncated content that gives no way to reach the full value."

[[rule]]
id = "better-interface/SKILL#19"
text_sha1 = "8ea6e76449da2bf88a979b2195c0af4d48f6701d"
map = "skill:critique/workflow"
canvas_text = "Flag content or a control reachable only past a scroll edge or behind a disclosure that has no visible cue."

[[rule]]
id = "better-interface/SKILL#20"
text_sha1 = "d4a46394ec54c7c66f8d0bf20a9daa382e61ee57"
map = "skill:critique/workflow"
canvas_text = "Flag an error message that names no way to recover from it."

[[rule]]
id = "better-interface/SKILL#21"
text_sha1 = "25212d1d55c678c4c99123816e34cb719f6ed494"
map = "skill:critique/workflow"
canvas_text = "Flag a semantic colour used against its meaning, such as the danger hue on a non-destructive action."

[[rule]]
id = "better-interface/SKILL#22"
text_sha1 = "9dac7443db75ed720c7a791b218ec5e22be33b83"
map = "rubric:motion"
canvas_text = "Flag a state change carried by motion alone: a colour, icon or label must remain when the animation does not run."

[[rule]]
id = "better-interface/SKILL#23"
text_sha1 = "7919a02089442b733316cf43c96744da08c2b53e"
map = "skill:critique/workflow"
canvas_text = "Repair by deleting first: a separator that space would carry, an animation on a high-frequency interaction, an ARIA attribute a native element makes redundant, a ramp nothing imports."

[[rule]]
id = "better-interface/SKILL#24"
text_sha1 = "7c26ad0fcc7f46eed7a935664a708f7c80b8f09a"
map = "skill:critique/workflow"
canvas_text = "Repair by using the platform: the native element, the native control or the browser's own focus ring in place of a custom rebuild."

[[rule]]
id = "better-interface/SKILL#25"
text_sha1 = "12e89368a7d2ab18edfab56244f779caca59947b"
map = "skill:critique/workflow"
canvas_text = "Repair by reusing what the project has: an existing token, spacing step or motion curve before any new value."

[[rule]]
id = "better-interface/SKILL#26"
text_sha1 = "ea0988f18882a80b865c2a9277fb4b164bece96e"
map = "skill:critique/workflow"
canvas_text = "Repair by correcting the value: the wrong easing, radius, gap or contrast pair, using the exact value the owning skill gives."

[[rule]]
id = "better-interface/SKILL#27"
text_sha1 = "ac65a5d24fc860c3cec967312fcf0b09897858ea"
map = "skill:critique/workflow"
canvas_text = "Repair by adding only what the platform cannot supply: a new token, a wrapper, a media query, an ARIA attribute."

[[rule]]
id = "better-interface/review-format#1"
text_sha1 = "d66631fade491eaa7cbb16c1c9fdf0a5b736468a"
map = "skill:critique/workflow"
canvas_text = "Take each finding's severity from ranking by user impact."

[[rule]]
id = "better-interface/review-format#2"
text_sha1 = "6129aebba0344d6a34d8029d357409aab528588f"
map = "skill:critique/workflow"
canvas_text = "Name each finding's domain as the owning review skill without the better- prefix."

[[rule]]
id = "better-interface/review-format#3"
text_sha1 = "3a851f0ae12a4861611979344768ddfe624eed8b"
map = "skill:critique/workflow"
canvas_text = "Give each finding's location as the exact frame and component (node id and layer path) when the artifact has no source file."

[[rule]]
id = "better-interface/review-format#4"
text_sha1 = "9b0dd49152b0acdddce11ad890edc5ae73c981a1"
map = "skill:critique/workflow"
canvas_text = "Show a finding's Before (the current design) and After (an actionable replacement), each in its own cell."

[[rule]]
id = "better-interface/review-format#5"
text_sha1 = "65a097bad0c51ea8d4b57dbe4db4a7363ea9d9dc"
map = "skill:critique/workflow"
canvas_text = "State in Why the violated principle and its user impact."

[[rule]]
id = "better-interface/review-format#6"
text_sha1 = "9f29ed753b5a79970eb3eb0cd5b6c8483aaa4e16"
map = "skill:critique/workflow"
canvas_text = "End the review with Block when one or more HIGH findings remain; do not ship until they are fixed."

[[rule]]
id = "better-interface/review-format#7"
text_sha1 = "07398f3aade7bc9bf4feb13b77fa7d2d06b91fdf"
map = "skill:critique/workflow"
canvas_text = "End the review with Approve when no HIGH finding remains; MEDIUM and LOW findings stay in the table as work to do."

[[rule]]
id = "better-layout/grouping-and-alignment#1"
text_sha1 = "d41bd87b079560f4536d5d090f66f79cfc06c4a5"
map = "lint:off-scale"
canvas_text = "Group related elements with negative space by default: on-scale auto-layout gaps and padding, no stray off-grid offsets; check with `designos_lint` off-scale."

[[rule]]
id = "better-layout/grouping-and-alignment#2"
text_sha1 = "e505916bc031f22e13be2df5d5c94787cdad9a77"
map = "rubric:layout"
canvas_text = "Use a background shape, a card or filled container, where a group must read as one unit, such as a selectable row or a draggable card."

[[rule]]
id = "better-layout/grouping-and-alignment#3"
text_sha1 = "08fc44981c36edc7f4fbe4383d9f3938c815b9b8"
map = "rubric:layout"
canvas_text = "Use separator lines only for dense data where space costs too much, such as tables and long settings lists."

[[rule]]
id = "better-layout/grouping-and-alignment#4"
text_sha1 = "5e466993cf6f7e214e590172f34ff788415245f6"
map = "lint:off-scale"
canvas_text = "Fix stray edges: an icon 2 px off the text edge, or a card padded unlike its neighbour; check with `designos_lint` off-scale."

[[rule]]
id = "better-layout/grouping-and-alignment#5"
text_sha1 = "254a7c6b3105b23fadff8d9ff95859bb07285fc2"
map = "lint:off-scale"
canvas_text = "Repeat the same spacing step in deeper nesting instead of inventing a new one; check with `designos_lint` off-scale."

[[rule]]
id = "better-layout/grouping-and-alignment#6"
text_sha1 = "fcba19822fca12c19e908f3a49aae6f813c495b7"
map = "rubric:typography"
canvas_text = "Right-align numbers in tables (end) and left-align text (start); tabular figures belong to typography."

[[rule]]
id = "better-layout/spacing-and-adaptivity#1"
text_sha1 = "6d7708d78a6e25f0a704c88ff4b6cd4db6285375"
map = "rubric:layout"
canvas_text = "Let a row of cards peek past the container edge: a row that ends exactly at the edge looks complete and nobody scrolls it."

[[rule]]
id = "better-layout/spacing-and-adaptivity#2"
text_sha1 = "96e9fabc223dc83a3663e83db2f271d35a1abbbc"
map = "rubric:layout"
canvas_text = "Give a collapsed section a chevron or a control that names what is hidden (\"Show 12 more results\", not \"More\")."

[[rule]]
id = "better-layout/spacing-and-adaptivity#3"
text_sha1 = "4d049e96b2996f7b396b028c47a1c51916034a34"
map = "lint:text-truncated"
canvas_text = "Pair every truncated value with an expand control, a link to a detail view or a tooltip that also opens on focus; hover-only hints do not count; check with `designos_lint` text-truncated."

[[rule]]
id = "better-layout/spacing-and-adaptivity#4"
text_sha1 = "2c0cdc833af7d9f6d4932a8b8e75dba1fc36abba"
map = "web-only"
reason = "`100dvh` against `100vh` concerns mobile browser toolbars."

[[rule]]
id = "better-layout/spacing-and-adaptivity#5"
text_sha1 = "d3f1ddc3ed5a9902e013404e689e843fcc4b5528"
map = "rubric:layout"
canvas_text = "Design a modal that fits the screen height with a scrolling body and an action row outside the scroll area."

[[rule]]
id = "better-layout/spacing-and-adaptivity#6"
text_sha1 = "7b7cd3a5b83f6160a77e452d7755c42e62e20e98"
map = "rubric:layout"
canvas_text = "Keep primary actions in stable chrome, such as a footer bar with safe-area padding or the top of the view."

[[rule]]
id = "better-typography/SKILL#1"
text_sha1 = "eca51f113ece73623e3d391e589e0458f83e21b0"
map = "rubric:typography"
canvas_text = "Balance the line lengths of headings and short descriptions so the lines even out; never on paragraphs."

[[rule]]
id = "better-typography/SKILL#2"
text_sha1 = "4dc8ebe249c99a13dfb1d3d899e71d5b5665976a"
map = "lint:text-unexpected-wrap"
canvas_text = "Keep a lone word off the last line of a paragraph; check with `designos_lint` text-unexpected-wrap."

[[rule]]
id = "better-typography/SKILL#3"
text_sha1 = "f88ceb7aaee67e61f0de3462b6957d966ddac4aa"
map = "lint:overflow-parent"
canvas_text = "Where a long word, link or ID could escape its container, let the text break inside the frame instead of overflowing it; check with `designos_lint` overflow-parent."

[[rule]]
id = "better-typography/SKILL#4"
text_sha1 = "e0b4fe820e066e98547951e6c4565b1dcb73424c"
map = "lint:text-unexpected-wrap"
canvas_text = "Keep labels and badges on one line where a line break looks broken; check with `designos_lint` text-unexpected-wrap."

[[rule]]
id = "better-typography/SKILL#5"
text_sha1 = "5a138d9535196c880cd29710cd23defca6f19a26"
map = "rubric:typography"
canvas_text = "Size input text up on mobile frames (16 px) so the control stays legible and does not trigger zoom."

[[rule]]
id = "better-typography/SKILL#6"
text_sha1 = "7eca50657bff06add54356970f7062ffcf2a6902"
map = "web-only"
reason = "CSS `transform: scale()` workarounds for iOS Safari input auto-zoom are web browser specific."

[[rule]]
id = "better-typography/details-and-accessibility#1"
text_sha1 = "2dc9bd73d78bbe45f2796c62740221598d1ee681"
map = "web-only"
reason = "CSS pseudo-elements (`::target-text`, `::placeholder`), `caret-color`, and the DOM Custom Highlight API have no static canvas equivalent."

[[rule]]
id = "better-typography/details-and-accessibility#2"
text_sha1 = "6dc024fdf23fbba8b664b59fcbe8fdc6e0ac2da8"
map = "web-only"
reason = "CSS pseudo-elements (`::target-text`, `::placeholder`), `caret-color`, and the DOM Custom Highlight API have no static canvas equivalent."

[[rule]]
id = "better-typography/details-and-accessibility#3"
text_sha1 = "f53d53c88c75bcd2990cb2396296b60ba9e087f6"
map = "web-only"
reason = "CSS pseudo-elements (`::target-text`, `::placeholder`), `caret-color`, and the DOM Custom Highlight API have no static canvas equivalent."

[[rule]]
id = "better-typography/details-and-accessibility#4"
text_sha1 = "42f3eb3769462172db874dcf67a85b49887ac6fb"
map = "web-only"
reason = "CSS pseudo-elements (`::target-text`, `::placeholder`), `caret-color`, and the DOM Custom Highlight API have no static canvas equivalent."

[[rule]]
id = "better-typography/variable-fonts-and-opentype#1"
text_sha1 = "b30b73600bad2c59d40c3f8558a5885aa4b9efb2"
map = "rubric:typography"
canvas_text = "A static font is one weight and style per file: regular, medium and bold are three files, so count them when choosing a family."

[[rule]]
id = "better-typography/variable-fonts-and-opentype#2"
text_sha1 = "e5d9add0f951f02eba58dcf209a6c0bdbce285fa"
map = "rubric:typography"
canvas_text = "Prefer a variable font where a whole weight range lives in one file and any value in it, such as 589, is usable on a text style."

[[rule]]
id = "better-typography/variable-fonts-and-opentype#3"
text_sha1 = "153634575205d94df39746694bf84472b15145a9"
map = "rubric:typography"
canvas_text = "Use real small capitals (the font's own small-cap glyphs), not uppercase letters set at a smaller size."

[[rule]]
id = "better-typography/variable-fonts-and-opentype#4"
text_sha1 = "e68561c1dea06c4473ecc21aa6989b0ea4c01ac2"
map = "rubric:typography"
canvas_text = "Use proper superscript and subscript glyphs (the 2 in x squared, H2O), not shrunken and shifted digits."

[[rule]]
id = "better-typography/wrapping-and-punctuation#1"
text_sha1 = "0ec485b7f4d982c72c8c746b2977dd3498869f48"
map = "rubric:typography"
canvas_text = "Align a paragraph of three or more lines to its own script, so an English paragraph stays start-aligned left-to-right even inside a right-to-left interface; one or two line snippets follow the UI direction."

[[rule]]
id = "better-typography/wrapping-and-punctuation#2"
text_sha1 = "dd68bc489638f73d038c3b32975069bc0f64fb6e"
map = "rubric:typography"
canvas_text = "Keep digit runs such as a phone number in their left-to-right order inside right-to-left text; repair a value that adjacent RTL text disturbs."

[[rule]]
id = "better-ui/enter-exit#1"
text_sha1 = "64a451533b865c99b1db320f8715241c53aa9016"
map = "rubric:motion"
canvas_text = "Split an entering element into semantic groups such as title, description and actions, each animated as one layer group."

[[rule]]
id = "better-ui/enter-exit#2"
text_sha1 = "37e07500610d7718170635b760bbee64640c438b"
map = "rubric:motion"
canvas_text = "Stagger the entering groups 100 ms apart in the prototype transition."

[[rule]]
id = "better-ui/enter-exit#3"
text_sha1 = "17426e57f41ca1822c044835fca99efd8f6d03e0"
map = "rubric:motion"
canvas_text = "Split a short display headline into words staggered 80 ms apart where it should read word by word."

[[rule]]
id = "better-ui/enter-exit#4"
text_sha1 = "b53995b306bf1db0bde0c1b3c8680427b8f7caa9"
map = "rubric:motion"
canvas_text = "Combine opacity, blur and a small upward translate for each group's enter."

[[rule]]
id = "better-ui/icons#1"
text_sha1 = "04b77891bb2ffeab872f86bdf51f41873e5f686f"
map = "rubric:iconography"
canvas_text = "Use one icon library per surface and never mix libraries on one toolbar; where it has no stroke variants, keep its native stroke and use size or colour for emphasis."

[[rule]]
id = "better-ui/icons#2"
text_sha1 = "a674dd6305397ad0cf615999f5ac4dcf84d11e28"
map = "rubric:iconography"
canvas_text = "Size an inline icon at 1 to 1.25 times the adjacent font size so the pair scales together."

[[rule]]
id = "better-ui/icons#3"
text_sha1 = "fe87566078ce418bcfd9a96ddcc0df936ab3a88a"
map = "rubric:iconography"
canvas_text = "Test every icon at the smallest size it renders, often 16 px; it must stay recognisable there."

[[rule]]
id = "better-ui/icons#4"
text_sha1 = "0183aea677899ffe37f8fa2196c5a28736233863"
map = "rubric:iconography"
canvas_text = "Prefer a simplified glyph for small contexts over scaling detailed artwork down."

[[rule]]
id = "better-ui/icons#5"
text_sha1 = "8259bed3804c3809e7b31518990e6f9ca3628967"
map = "rubric:iconography"
canvas_text = "Where the icon set ships per-size grids (16, 20, 24), use the grid that matches the render size; a 24 px drawing scaled to 16 px lands off the pixel grid and renders soft."

[[rule]]
id = "better-ui/icons#6"
text_sha1 = "faa49e811ea371941fb68bac8a71cb18bc05c6a7"
map = "rubric:iconography"
canvas_text = "Use vector SVG icons, never raster."

[[rule]]
id = "better-writing/SKILL#1"
text_sha1 = "225085753bbd56e250c543ceb342dc31e4920ed7"
map = "web-only"
reason = "Searching for translation calls and locale files is a source-code step; a canvas document has no i18n catalogue."

[[rule]]
id = "better-writing/SKILL#2"
text_sha1 = "30c43560be86ad16d0073e9f693c696271c0dfbc"
map = "skill:generate-design/content"
canvas_text = "List the noun used for each object and the verb used for each action (\"project\" or \"workspace\", \"Delete\" or \"Remove\") and keep them consistent in every frame."

[[rule]]
id = "better-writing/SKILL#3"
text_sha1 = "ca2c2cc7d759512c75f28aa20dcde1df8c9de6cf"
map = "skill:generate-design/content"
canvas_text = "Note the capitalisation used for each element type and any voice or content style guide, and apply it to every label and heading."

