[package]
name = "designos-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "designos-mcp"

[[bin]]
name = "designos-mcp"
path = "src/main.rs"

[[bin]]
name = "gen-tool-docs"
path = "src/bin/gen-tool-docs.rs"

[dependencies]
designos-diff.workspace = true
designos-doc.workspace = true
designos-export.workspace = true
designos-fig.workspace = true
designos-library.workspace = true
designos-webcapture.workspace = true
designos-render.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
quick-xml = "0.41"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process"] }
