[package]
name = "designos-fig"
description = "Figma file import/export: REST JSON and .fig (fig-kiwi) binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Blocking Figma REST client (`rest` module). Needs a user-supplied token at runtime.
net = ["dep:ureq"]

[dependencies]
designos-doc.workspace = true
designos-webcapture.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror.workspace = true
base64 = "0.22"
flate2 = "1"
ruzstd = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = { version = "2", optional = true }

[dev-dependencies]
designos-render.workspace = true
