[package]
name = "designos-svg"
description = "SVG import for designos: maps a usvg tree onto designos nodes"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
designos-doc.workspace = true
designos-fonts = { path = "../designos-fonts", default-features = false }
designos-render.workspace = true
image = { workspace = true, features = ["jpeg", "gif", "webp"] }
roxmltree = "0.20"
thiserror.workspace = true
usvg = { version = "0.45", default-features = false, features = ["text"] }

[dev-dependencies]
base64 = "0.22"
designos-fonts = { path = "../designos-fonts", default-features = false }
designos-export.workspace = true
resvg = { version = "0.45", default-features = false, features = ["text"] }
tiny-skia.workspace = true
