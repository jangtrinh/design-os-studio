<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scrolled Fixture</title>
  <style>
    body { margin: 0; height: 3000px; }
    #sticky-bar { position: sticky; top: 0; width: 200px; height: 30px; background: #ddd; }
    #fixed-bar { position: fixed; top: 0; left: 300px; width: 200px; height: 30px; background: #bbb; }
    #flow-row { margin-top: 600px; width: 200px; height: 30px; background: #999; }
  </style>
</head>
<body>
  <div id="sticky-bar">sticky</div>
  <div id="fixed-bar">fixed</div>
  <div id="flow-row">flow</div>
</body>
</html>
