<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stacking Fixture</title>
  <style>
    body { margin: 0; }
    .box { width: 40px; height: 20px; }
    #parent-z1 { position: relative; z-index: 1; }
    #uncle-auto { position: relative; }
    #overlay { position: absolute; top: 0; left: 200px; z-index: 2147483647; }
    #behind { position: absolute; top: 0; left: 300px; z-index: -1; }
    #opacity-ctx { opacity: 0.9; }
    #transform-ctx { transform: translateZ(0); }
    #flex-row { display: flex; }
    #flex-z0 { z-index: 0; }
    #flex-opacity { opacity: 0.9; }
  </style>
</head>
<body>
  <div id="flow-first" class="box">flow</div>
  <div id="opacity-ctx" class="box">
    <div id="opacity-child" class="box">op-child</div>
  </div>
  <div id="flow-after-opacity" class="box">after-op</div>
  <div id="transform-ctx" class="box">tx</div>
  <div id="flow-after-transform" class="box">after-tx</div>
  <div id="flex-row">
    <div id="flex-z0" class="box">z0</div>
    <div id="flex-opacity" class="box">f-op</div>
    <div id="flex-plain" class="box">f-plain</div>
  </div>
  <div id="parent-z1" class="box">
    <div id="child-in-z1" class="box">child</div>
  </div>
  <div id="uncle-auto" class="box">uncle</div>
  <div id="overlay" class="box">overlay</div>
  <div id="behind" class="box">behind</div>
</body>
</html>
