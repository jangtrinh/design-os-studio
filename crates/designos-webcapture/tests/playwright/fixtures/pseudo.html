<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pseudo Fixture</title>
  <style>
    body { margin: 0; padding: 30px; }
    .host { position: relative; width: 300px; height: 100px; border: 4px solid #000; padding: 10px; margin-bottom: 40px; }
    #abs-host::before { content: ""; position: absolute; top: 8px; left: 100px; width: 20px; height: 10px; background: #ff0000; }
    #flow-host::before { content: ""; display: block; width: 30px; height: 12px; margin: 3px 5px; background: #ff0000; }
    #flow-host::after { content: ""; display: block; width: 30px; height: 12px; margin: 3px 5px; background: #0000ff; }
    .host .kid { width: 50px; height: 40px; background: #cccccc; }
  </style>
</head>
<body>
  <div id="abs-host" class="host"></div>
  <div id="flow-host" class="host"><div class="kid" id="flow-kid"></div></div>
</body>
</html>
