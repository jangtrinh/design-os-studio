# Mid-session agent failure output patterns (#686).
# Every pattern must name a class, a regex (or alternation of context phrases with optional
# `(?P<reset>\d{1,2}:\d{2})` reset-time capture), and the captured-output fixture file that proves it.
# Table order within each CLI defines precedence when multiple patterns match.

[[cli.claude.pattern]]
class = "rate_limited"
regex = "rate_limit_error|exceeded your rate limit|429.*rate limit|resets at (?P<reset>\\d{1,2}:\\d{2})"
fixture = "tests/fixtures/agent-failures/claude-rate-limited.txt"

[[cli.claude.pattern]]
class = "login_expired"
regex = "authentication_error|oauth token has expired|please run /login|invalid api key · please run /login"
fixture = "tests/fixtures/agent-failures/claude-login-expired.txt"

[[cli.claude.pattern]]
class = "billing_or_quota"
regex = "credit balance is too low|plans & billing|purchase credits|billing_error"
fixture = "tests/fixtures/agent-failures/claude-billing.txt"

[[cli.claude.pattern]]
class = "provider_server_error"
regex = "overloaded_error|api error: 529|api error: 500|api error: 502|api error: 503|temporarily overloaded"
fixture = "tests/fixtures/agent-failures/claude-server-error.txt"

[[cli.claude.pattern]]
class = "context_full"
regex = "prompt is too long|maximum context length|context window is full"
fixture = "tests/fixtures/agent-failures/claude-context-full.txt"

[[cli.claude.pattern]]
class = "network_offline"
regex = "fetch failed.*econnrefused|enotfound api\\.anthropic\\.com|unable to connect to network|network is unreachable"
fixture = "tests/fixtures/agent-failures/claude-network-offline.txt"

