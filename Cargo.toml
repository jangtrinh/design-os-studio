[workspace]
resolver = "2"
members = [
    "crates/designos-doc",
    "crates/designos-render",
    "crates/designos-fonts",
    "crates/designos-fig",
    "crates/designos-library",
    "crates/designos-app",
    "crates/designos-diff",
    "crates/designos-export",
    "crates/designos-svg",
    "crates/designos-gpu",
    "crates/designos-mcp",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jangtrinh/design-os-studio"

[workspace.dependencies]
designos-doc = { path = "crates/designos-doc" }
designos-render = { path = "crates/designos-render" }
designos-fig = { path = "crates/designos-fig" }
designos-library = { path = "crates/designos-library" }
designos-fonts = { path = "crates/designos-fonts" }
designos-export = { path = "crates/designos-export" }
designos-svg = { path = "crates/designos-svg" }
designos-gpu = { path = "crates/designos-gpu" }
designos-mcp = { path = "crates/designos-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev.package."*"]
opt-level = 2
