name: PR Labeller

on:
  workflow_run:
    workflows: ["PR Gate"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read
  actions: read

jobs:
  label:
    name: PR Labeller
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Never check out PR code: fetch only scripts/pr_labels.py from the base default branch.
      - name: Checkout trusted label script from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/pr_labels.py
          sparse-checkout-cone-mode: false

      - name: Download artifact, validate fields, and apply labels
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/pr-gate-artifact"
          mkdir -p "$artifact_dir"
          artifact_json="$artifact_dir/pr-gate-result.json"
          artifact_id="$(
            gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "pr-gate-result" and .expired == false) | .id' \
              | head -n 1 || true
          )"
          if [ -z "$artifact_id" ]; then
            echo "::notice::pr-gate-result artifact is missing for run ${RUN_ID}; nothing to label."
            python3 -B scripts/pr_labels.py "$artifact_json"
            exit 0
          fi
          gh api "repos/${GH_REPO}/actions/artifacts/${artifact_id}/zip" > "$artifact_dir/pr-gate-result.zip"
          unzip -p "$artifact_dir/pr-gate-result.zip" pr-gate-result.json > "$artifact_json"
          jq -e '
            type == "object"
            and (.pr_number | type == "number" and floor == . and . > 0)
            and (.head_sha | type == "string" and test("^[0-9a-fA-F]{40}$"))
            and (.additions | type == "number" and floor == . and . >= 0)
            and (.deletions | type == "number" and floor == . and . >= 0)
            and (.lines_changed | type == "number" and floor == . and . >= 0)
            and (.lines_changed == (.additions + .deletions))
            and (.changed_files | type == "number" and floor == . and . >= 0)
            and (.paths | type == "array" and all(.[]; type == "string" and length > 0))
            and ((.paths | length) == .changed_files)
          ' "$artifact_json" >/dev/null
          pr_number="$(jq -r '.pr_number' "$artifact_json")"
          head_sha="$(jq -r '.head_sha' "$artifact_json")"
          if [ "$head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Artifact head_sha ($head_sha) != workflow_run.head_sha ($EXPECTED_HEAD_SHA)"
            exit 1
          fi
          labels_output="$(python3 -B scripts/pr_labels.py "$artifact_json")"
          [ -z "$labels_output" ] && exit 0
          ensure_label() {
            local encoded="${1//\//%2F}"
            gh api "repos/${GH_REPO}/labels/${encoded}" >/dev/null 2>&1 || \
              gh api "repos/${GH_REPO}/labels" -X POST -f name="$1" -f color="$2" -f description="$3" >/dev/null
          }
          labels_json="[]"
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            case "$label" in
              "size/L") ensure_label "size/L" "d93f0b" "Pull request changes > 400 lines or > 10 files" ;;
              "sensitive-path") ensure_label "sensitive-path" "b60205" "Pull request touches security- or release-sensitive paths" ;;
              *) echo "::error::Unexpected label: $label"; exit 1 ;;
            esac
            labels_json="$(jq -cn --argjson arr "$labels_json" --arg l "$label" '$arr + [$l]')"
          done <<< "$labels_output"
          jq -cn --argjson labels "$labels_json" '{labels: $labels}' \
            | gh api "repos/${GH_REPO}/issues/${pr_number}/labels" -X POST --input - >/dev/null
