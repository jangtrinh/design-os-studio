name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and packages everything across macOS, Windows, and Linux,
  # uploads workflow artifacts, and creates no GitHub Release.
  workflow_dispatch:

env:
  RUST_VERSION: "1.93.1"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The binaries report CARGO_PKG_VERSION (About dialog, self-updater), so a tag
  # that differs from the workspace version ships an app that misreports itself.
  version-check:
    name: Tag matches Cargo version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag and [workspace.package] version
        shell: bash
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "workspace version: ${cargo_version}"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "${cargo_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}. Bump [workspace.package] version first (docs/releasing.md, step 2)."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfontconfig1-dev dpkg-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # On Windows, crates/designos-app/build.rs embeds the icon and version info
      # (rc.exe ships with the runner's Windows SDK); it fails the build under CI
      # if that step breaks, so an icon-less exe is never released.
      - name: Build designos-studio, designos, designos-mcp, and designos-diff
        run: cargo build --release --locked --target ${{ matrix.target }} -p designos-app -p designos-mcp -p designos-diff

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package installers and archives
        shell: bash
        run: scripts/package.sh "${{ matrix.target }}" "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: designos-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # One job builds both Apple architectures and packages a universal designos.app
  # (.dmg for users + install-cli.command, .tar.gz for scripts & self-updater).
  macos:
    name: Build macOS universal app
    needs: version-check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-universal

      - name: Build both architectures (designos-studio, designos, designos-mcp, designos-diff)
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t" -p designos-app -p designos-mcp -p designos-diff
          done

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package designos.app (.dmg and .tar.gz)
        run: scripts/package-macos.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: designos-macos-universal
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version-check, build, macos]
    # Tags only: manual (workflow_dispatch) runs stop after uploading artifacts.
    # macOS is the verified platform: a failed Windows or Linux build leaves its
    # package out of the release instead of blocking the macOS release.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v')
      && needs.version-check.result == 'success'
      && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS and release-manifest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/build-release.sh "$version" --generate-manifest
          rm -f dist/*.sha256
          cat dist/SHA256SUMS
          cat dist/release-manifest.json

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### Installing **design:os studio**

            Download the installer for your platform below. Every package includes all 4 tools (`designos-studio`, `designos`, `designos-mcp`, and `designos-diff`):

            - **macOS (Apple Silicon & Intel Universal):**
              - Download `designos-<version>-macos.dmg`, open it, and drag **designos.app** to **Applications**.
              - *(Optional)* Double-click `install-cli.command` inside the DMG to clear the macOS quarantine attribute and symlink `designos-studio`, `designos`, `designos-mcp`, and `designos-diff` onto your `PATH`.
            - **Windows (x64):**
              - **GUI Installer (when attached):** `designos-<version>-x86_64-pc-windows-msvc-setup.exe` is a per-user install with no Administrator prompt. It creates Desktop and Start Menu shortcuts and registers `.designos` and `.fig` files. It is only built when the runner has NSIS; otherwise use the ZIP below.
              - **Portable ZIP / PowerShell:** Unzip `designos-<version>-x86_64-pc-windows-msvc.zip` and run `powershell -ExecutionPolicy Bypass -File .\install.ps1`.
            - **Linux (x64):**
              - **Ubuntu / Debian (`.deb`):** `sudo apt install ./designos_<version>_amd64.deb`
              - **Any Linux distro (`.tar.gz`):** Unpack `designos-<version>-x86_64-unknown-linux-gnu.tar.gz` and run `./install.sh` (installs under `~/.local`, no `sudo` needed).

            Full instructions: [docs/install.md](https://github.com/jangtrinh/design-os-studio/blob/main/docs/install.md). Verify downloads against `SHA256SUMS` or `release-manifest.json`.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.deb
            dist/*.zip
            dist/*.tar.gz
            dist/release-manifest.json
            dist/SHA256SUMS
