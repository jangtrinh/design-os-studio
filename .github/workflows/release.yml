name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and packages everything across macOS, Windows, and Linux,
  # uploads workflow artifacts, and creates no GitHub Release.
  workflow_dispatch:

env:
  RUST_VERSION: "1.93.1"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The binaries report CARGO_PKG_VERSION (About dialog, self-updater), so a tag
  # that differs from the workspace version ships an app that misreports itself.
  version-check:
    name: Tag matches Cargo version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag and [workspace.package] version
        shell: bash
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "workspace version: ${cargo_version}"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "${cargo_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}. Bump [workspace.package] version first (docs/releasing.md, step 2)."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfontconfig1-dev dpkg-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # On Windows, crates/designos-app/build.rs embeds the icon and version info
      # (rc.exe ships with the runner's Windows SDK); it fails the build under CI
      # if that step breaks, so an icon-less exe is never released.
      - name: Build designos-studio, designos, designos-mcp, and designos-diff
        run: cargo build --release --locked --target ${{ matrix.target }} -p designos-app -p designos-mcp -p designos-diff

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package installers and archives
        shell: bash
        run: scripts/package.sh "${{ matrix.target }}" "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: designos-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # One job builds both Apple architectures and packages a universal designos.app
  # (.dmg for users + install-cli.command, .tar.gz for scripts & self-updater).
  macos:
    name: Build macOS universal app
    needs: version-check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-universal

      - name: Build both architectures (designos-studio, designos, designos-mcp, designos-diff)
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t" -p designos-app -p designos-mcp -p designos-diff
          done

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package designos.app (.dmg and .tar.gz)
        run: scripts/package-macos.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: designos-macos-universal
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version-check, build, macos]
    # Tags only: manual (workflow_dispatch) runs stop after uploading artifacts.
    # macOS is the verified platform: a failed Windows or Linux build leaves its
    # package out of the release instead of blocking the macOS release.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v')
      && needs.version-check.result == 'success'
      && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS and release-manifest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/build-release.sh "$version" --generate-manifest
          rm -f dist/*.sha256
          cat dist/SHA256SUMS
          cat dist/release-manifest.json

      - name: Build release notes from template
        run: |
          tag="${GITHUB_REF_NAME}"; v="${tag#v}"
          notes="docs/releases/${tag}.md"
          test -f "$notes" || { echo "::error::Missing $notes (Highlights/Fixes/Known issues)"; exit 1; }
          { cat "$notes"; echo; echo "## Downloads"; echo
            echo "DESIGN:OS Studio is free. Every package includes designos-studio, designos, designos-mcp and designos-diff."; echo
            echo "| OS | File |"; echo "|---|---|"
            for f in dist/*.dmg dist/*-setup.exe dist/*.zip dist/*.deb dist/*.tar.gz; do [ -e "$f" ] || continue
              n=$(basename "$f"); case "$n" in *.dmg|*macos*) os=macOS;; *windows*|*.exe) os="Windows x64";; *) os="Linux x64";; esac
              echo "| $os | \`$n\` |"; done
            echo; echo "Install guide: [docs/install.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/install.md)"
            echo; echo "## Checksums"; echo; echo '```'; cat dist/SHA256SUMS; echo '```'
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
            [ -n "$prev" ] && echo && echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
          } > dist/RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          name: DESIGN:OS Studio ${{ github.ref_name }}${{ vars.RELEASE_PACK && format(' — {0}', vars.RELEASE_PACK) || '' }}
          # Body = hand-written notes from docs/releases/<tag>.md (Highlights/Fixes/Known issues),
          # then generated Downloads table + Checksums. Fails if notes file is missing.
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.deb
            dist/*.zip
            dist/*.tar.gz
            dist/release-manifest.json
            dist/SHA256SUMS
