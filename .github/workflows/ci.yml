name: CI

# Diagnostic only (#1066): print the Windows failure messages that the leave_prompt
# stack overflow hides. Never merge this branch.

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.93.1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  windows-diag:
    name: Windows diagnostic (#1066)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      - name: Build app test binaries
        run: cargo test -p designos-app --bins --locked --no-run

      - name: agent_stop tests, designos bin
        continue-on-error: true
        run: cargo test -p designos-app --bin designos --locked -- agent_stop --skip leave_prompt --test-threads=1

      - name: check_designs clicking_a_row, designos bin
        continue-on-error: true
        run: cargo test -p designos-app --bin designos --locked -- check_designs::clicking_a_row --skip leave_prompt --test-threads=1

      - name: Whole designos bin without leave_prompt
        continue-on-error: true
        run: cargo test -p designos-app --bin designos --locked -- --skip leave_prompt

      - name: Whole designos-studio bin without leave_prompt
        continue-on-error: true
        run: cargo test -p designos-app --bin designos-studio --locked -- --skip leave_prompt
