<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video 02 — Figma 100/100 A-to-Z Micro-Interactions (HyperFrames Beat Draft)</title>
  <link rel="stylesheet" href="./geist-fonts.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:40px 24px;background:#0c0d10;color:#f7f7f7;font-family:Geist,Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    main{max-width:930px;margin:auto}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}
    h1{margin:0;font-size:24px;letter-spacing:-.03em;line-height:1.15}
    header p{margin:8px 0 0;color:#a1a1aa;font-size:13px}
    header a{color:#0d99ff;font-size:13px;font-weight:600;text-decoration:none}
    header a .arrow-icon{vertical-align:-2px}
    .panel{border:1px solid #ffffff18;border-radius:18px;padding:20px;background:#17181d;box-shadow:0 1px 2px #0006,0 8px 22px -8px #0008,0 30px 70px -20px #0009}
    .stage-shell{width:min(100%,640px);aspect-ratio:16/9;margin:0 auto;overflow:hidden;border:1px solid #ffffff24;border-radius:12px;background:#f4f3ef}
    #hyperframe-stage{position:relative;width:640px;height:360px;transform-origin:top left}
    .controls{display:flex;align-items:center;gap:14px;margin-top:20px}
    button{border:1px solid #ffffff2a;border-radius:10px;padding:9px 17px;background:#292b32;color:#fff;font:inherit;cursor:pointer}
    input{flex:1;accent-color:#0d99ff}
    #timecode{min-width:95px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:#d4d4d8;font-family:Geist Mono,monospace}
    #beat-name{margin-top:15px;color:#a1a1aa;font-size:13px;font-family:Geist Mono,monospace}
  </style>
  <script src="./runtime/gsap.min.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Video 02 — Figma 100/100 A-to-Z Micro-Interactions (HyperFrames Beat Draft)</h1>
        <p>10 beat-synced states · 28 beats (7 bars @ 100.60 BPM) · 16.70 s · HyperFrames v2 Stage-3 Draft</p>
      </div>
      <a href="./02-figma-100-micro-interactions.html">Open Dressed 1440×1440 One-Shape Player <svg class="arrow-icon" aria-hidden="true" width="13" height="13" viewBox="0 0 256 256" fill="currentColor"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/></svg></a>
    </header>
    <div class="panel">
      <div class="stage-shell" id="stage-shell"><div id="hyperframe-stage" role="img" aria-label="Video 02 — Figma 100/100 A-to-Z Micro-Interactions (HyperFrames Beat Draft)"></div></div>
      <div class="controls">
        <button id="play-button" type="button">Play</button>
        <input id="scrubber" type="range" min="0" max="16.70" step="0.001" value="0" aria-label="Scrub beat draft">
        <output id="timecode">00:00.0</output>
      </div>
      <div id="beat-name">s1</div>
    </div>
  </main>
  <script type="module">
    import { HYPERFRAME_STORYBOARDS, HYPERFRAME_DURATION, buildStudioHyperFrameDraft } from "./hyperframes-beats.mjs";
    const slug = "02-figma-100-micro-interactions";
    const storyboard = HYPERFRAME_STORYBOARDS[slug];
    const stage = document.getElementById("hyperframe-stage");
    const shell = document.getElementById("stage-shell");
    const scrubber = document.getElementById("scrubber");
    const playButton = document.getElementById("play-button");
    const timeline = buildStudioHyperFrameDraft(stage, slug);
    let currentTime = 0;
    let playing = false;
    let lastTick = null;
    function resize() { stage.style.transform = `scale(${shell.clientWidth / 640})`; }
    window.__seekToTime = time => {
      currentTime = Math.max(0, Math.min(HYPERFRAME_DURATION, Number(time) || 0));
      const active = [...storyboard].reverse().find(beat => beat.start <= currentTime) || storyboard[0];
      const pose = matchMedia("(prefers-reduced-motion: reduce)").matches ? Math.min(active.end - 0.001, HYPERFRAME_DURATION) : currentTime;
      timeline.time(pose, false);
      scrubber.value = String(currentTime);
      document.getElementById("timecode").textContent = `00:${currentTime.toFixed(1).padStart(4, "0")}`;
      document.getElementById("beat-name").textContent = `${active.kind} · ${active.id} — ${active.text}`;
      return currentTime;
    };
    window.seek = window.__seekToTime;
    function tick(timestamp) {
      if (!playing) return;
      if (lastTick !== null) window.__seekToTime(currentTime + (timestamp - lastTick) / 1000);
      lastTick = timestamp;
      if (currentTime >= HYPERFRAME_DURATION) { playing = false; playButton.textContent = "Play"; return; }
      requestAnimationFrame(tick);
    }
    playButton.addEventListener("click", () => {
      playing = !playing; lastTick = null; playButton.textContent = playing ? "Pause" : "Play";
      if (playing) { if (currentTime >= HYPERFRAME_DURATION) window.__seekToTime(0); requestAnimationFrame(tick); }
    });
    scrubber.addEventListener("input", () => { playing = false; playButton.textContent = "Play"; window.__seekToTime(scrubber.value); });
    addEventListener("resize", resize);
    resize();
    window.__seekToTime(Number(new URLSearchParams(location.search).get("t") || 0));
    window.__hyperFramesDraft = { timeline, storyboard };
    window.__readyPromise = document.fonts.ready.then(() => true);
  </script>
</body>
</html>
